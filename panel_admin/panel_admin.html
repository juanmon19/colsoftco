<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Max & Flex</title>
    
</head>
<style>
:root{
    --dorado:#D4AF37;
    --azul:#0A1F44;
    --blanco:#ffffff;
    --gris:#f2f2f2;
}

/* ===== GENERAL ===== */
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: var(--gris);
    font-size:14px;
}

/* ===== HEADER ===== */
.header {
    background-color: #0A1F44;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 29px;
    font-weight: bold;
    position: relative;
}

.logo {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
}

.logo img{
    width: 75px;
    cursor: pointer;
    margin-top: 10px;
} 

/* ===== LAYOUT ===== */
.contenedor{
    display:flex;
    min-height:90vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:250px;
    background-color: var(--blanco);
    padding:20px;
    border-right:5px solid var(--dorado);
}

.sidebar button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background-color: var(--azul);
    color:var(--blanco);
    border:none;
    cursor:pointer;
    border-radius:5px;
    font-size:14px;   /* Botones */
}

.sidebar button:hover{
    background-color: var(--dorado);
    color:var(--azul);
}

/* ===== CONTENIDO ===== */
.contenido{
    flex:1;
    padding:40px;
}

/* BIENVENIDO */
.bienvenida{
    display:flex;
    align-items:center;
    gap:40px;
    margin-bottom:40px;
}

.bienvenida img{
    width:150px;
    border:4px solid var(--dorado);
    border-radius:10px;
}

.info-usuario h2{
    margin:0;
    color:var(--azul);
    font-size:20px;   /* H2 */
}

.info-usuario p{
    font-size:14px;
}

/* TAREAS */
.tareas{
    background-color: var(--blanco);
    padding:20px;
    border-left:6px solid var(--azul);
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.tareas h3{
    margin-top:0;
    color:var(--azul);
    font-size:16px;   /* H3 */
}

.tareas ul{
    padding-left:20px;
}

.tareas li{
    margin-bottom:8px;
    font-size:14px;
}

/* RESPONSIVE */
@media(max-width:900px){
    .contenedor{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:5px solid var(--dorado);
    }

    .bienvenida{
        flex-direction:column;
        text-align:center;
    }
}
</style>
<body>

    <div class="header">
        BIENVENIDO
        <div class="logo">
            <img src="../imagenes/logo.png">
        </div>
    </div>

    <div class="contenedor">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <button onclick="mostrar('Proveedores')">Lista de Proveedores</button>
            <button onclick="mostrar('Registro Proveedor')">Registrar Proveedor</button>
            <button onclick="mostrar('Verificación')">Lista Verificación</button>
            <button onclick="mostrar('Informe')">Generar Informe</button>
            <button onclick="mostrar('Producto')">Registrar Producto</button>
            <button onclick="mostrar('Stock')">Control de Stock</button>
            <button onclick="mostrar('Materia')">Inventario Materia Prima</button>
            <button onclick="mostrar('Productos')">Inventario de Productos</button>
        </div>

        <!-- CONTENIDO -->
        <div class="contenido">

            <div class="bienvenida">
                <!-- Imagen usuario -->
                <img src="../imagenes/usuario.jpg" alt="Usuario">

                <div class="info-usuario">
                    <h2><strong>Usuario:</strong> Duvan Esteban Martínez Velandia</h2>
                    <p><strong>Rol:</strong> Administrador</p>
                </div>
            </div>

            <div class="tareas">
                <h3>Tareas Pendientes</h3>
                <ul>
                    <li>Solicitar espuma</li>
                    <li>Pedido N° 345</li>
                    <li>Verificar inventario</li>
                    <li>Supervisar el área de producción</li>
                    <li>Contactar proveedor N° 12</li>
                </ul>
            </div>

        </div>
    </div>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>

</html>
