<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>control de stock</title>
</head>
<style>
:root {
  --gold:        #D4AF37;
  --gold-dark:   #D4AF37;
  --blue:        #0A1F44;
  --blue-dark:   #0A1F44;
  --blue-light:  #0A1F44;
  --white:       #FFFFFF;
  --bg:          #FFFFFF;
  --gray-bg:     #f4f6fb;
  --gray-border: #c8d0e0;
  --gray-text:   #102764;

  --font: Arial, Helvetica, sans-serif;

  --h1:     22px;
  --h2-lg:  17.33px;
  --h2-sm:  16px;
  --table:  14.67px;
  --btn:    14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--gray-bg);
  min-height: 100vh;
  color: var(--blue);
}

/* ══ HEADER ══ */
header {
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  height: 66px;
  border-bottom: 3px solid var(--gold);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(11,61,145,.35);
}

.logo {
  position: relative;
  left: 2px;
  top: 52%;
  transform: translateY(-50%);
}

.logo img {
  width: 60px;
  cursor: pointer;
  margin-top: 10px;
}

/* Título central en el header */
.header-title {
  font-family: var(--font);
  font-size: var(--h1);
  font-weight: 900;
  color: var(--white);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,.3);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* User badge */
.user-badge {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--white);
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.avatar-sm {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--blue-dark);
  font-weight: 900;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,255,255,.55);
}

/* ══ CUERPO ══ */
.page-body {
  display: flex;
  max-width: 1180px;
  margin: 30px auto;
  gap: 22px;
  padding: 0 24px 44px;
}

/* ══ SIDEBAR ══ */
aside {
  width: 210px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

aside a {
  display: block;
  background: var(--blue);
  color: var(--white);
  text-decoration: none;
  text-align: center;
  padding: 11px 10px;
  border-radius: 4px;
  font-size: var(--btn);
  font-weight: 700;
  transition: background .18s, color .18s, transform .12s;
  border-left: 4px solid transparent;
}

aside a:hover {
  background: var(--blue-light);
  transform: translateX(3px);
}

aside a.active {
  background: var(--gold);
  color: var(--blue-dark);
  border-left-color: var(--blue-dark);
}

/* ══ CONTENIDO ══ */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ══ FORMULARIO ══ */
.form-card {
  background: var(--white);
  border-radius: 5px;
  box-shadow: 0 1px 6px rgba(11,61,145,.1);
  overflow: hidden;
}

.form-header {
  background: var(--blue);
  color: var(--white);
  padding: 13px 24px;
  font-size: var(--h2-sm);
  font-weight: 700;
  border-bottom: 3px solid var(--gold);
  display: flex;
  align-items: center;
  gap: 10px;
}

.form-header-bar {
  display: inline-block;
  width: 4px;
  height: 18px;
  background: var(--gold);
  border-radius: 2px;
  flex-shrink: 0;
}

.form-body {
  padding: 28px 32px 34px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 28px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-group.full { grid-column: 1 / -1; }

label {
  font-size: 13px;
  font-weight: 700;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

input[type="text"],
input[type="number"],
select {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--gray-border);
  border-radius: 4px;
  font-family: var(--font);
  font-size: var(--table);
  color: #1a2a4a;
  background: #fafbfd;
  transition: border-color .2s, box-shadow .2s;
  appearance: none;
  -webkit-appearance: none;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(11,61,145,.13);
  background: var(--white);
}

.select-wrap { position: relative; }

.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--blue);
  pointer-events: none;
  font-size: 12px;
}

.form-divider {
  grid-column: 1 / -1;
  border: none;
  border-top: 1.5px solid var(--gray-border);
  margin: 2px 0;
}

.check-section { grid-column: 1 / -1; }
.check-section > label { display: block; margin-bottom: 12px; }
.check-options { display: flex; gap: 26px; flex-wrap: wrap; }

.check-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.check-opt input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: var(--blue);
  cursor: pointer;
}

.check-opt span {
  font-size: var(--table);
  font-weight: 600;
  color: #1a2a4a;
}

.form-actions {
  grid-column: 1 / -1;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 6px;
}

.btn {
  padding: 9px 30px;
  border: none;
  border-radius: 4px;
  font-family: var(--font);
  font-size: var(--btn);
  font-weight: 700;
  cursor: pointer;
  transition: background .18s, transform .1s, box-shadow .18s;
}

.btn-outline {
  background: var(--white);
  color: var(--blue);
  border: 1.5px solid var(--blue);
}

.btn-outline:hover { background: var(--gray-bg); }

.btn-primary {
  background: var(--blue);
  color: var(--white);
  box-shadow: 0 3px 10px rgba(11,61,145,.28);
}

.btn-primary:hover {
  background: var(--blue-light);
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(11,61,145,.32);
}

.btn-primary:active { transform: translateY(0); }

/* ══ TOAST ══ */
.toast {
  display: none;
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--blue);
  color: var(--white);
  padding: 13px 20px;
  border-radius: 5px;
  border-left: 4px solid var(--gold);
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 4px 18px rgba(0,0,0,.22);
  z-index: 999;
}
</style>
<body>

  <!-- ══ ENCABEZADO ══ -->
  <header>
    <a class="logo">
      <img src="../imagenes/logo.png" alt="logo">
    </a>

    <!-- Título centrado en el header -->
    <span class="header-title">Control de Stock</span>

    <!-- Usuario activo -->
    <div class="user-badge">
      <div class="avatar-sm">D</div>
      <span>Duvan Martínez</span>
    </div>
  </header>

  <!-- ══ CUERPO (sin banner) ══ -->
  <div class="page-body">

    <!-- Contenido -->
    <div class="content" style="margin: 0 auto; max-width: 1000px; width: 100%;">

      <!-- Formulario -->
      <div class="form-card">
        <div class="form-header">
          <span class="form-header-bar"></span>
          Registra el nivel mínimo de cada materia prima
        </div>
        <div class="form-body">
          <form id="regForm">
            <div class="form-grid">

              <!-- Producto -->
              <div class="form-group">
                <label for="producto">Producto</label>
                <div class="select-wrap">
                  <select id="producto" name="producto">
                    <option value="">-- Seleccione --</option>
                    <option value="tela">Tela</option>
                    <option value="hilo">Hilo</option>
                    <option value="boton">Botón</option>
                    <option value="cierre">Cierre</option>
                    <option value="espuma">Espuma</option>
                    <option value="elastico">Elástico</option>
                  </select>
                </div>
              </div>

              <!-- Unidad de medida -->
              <div class="form-group">
                <label for="unidad">Unidad de medida</label>
                <div class="select-wrap">
                  <select id="unidad" name="unidad">
                    <option value="">-- Seleccione --</option>
                    <option value="metro">(metro) M</option>
                    <option value="kg">(kilogramo) Kg</option>
                    <option value="unidad">(unidad) Und</option>
                    <option value="litro">(litro) L</option>
                    <option value="cm">(centímetro) Cm</option>
                  </select>
                </div>
              </div>

              <!-- Cantidad mínima -->
              <div class="form-group full">
                <label for="cantidad">Cantidad mínima</label>
                <input
                  type="number"
                  id="cantidad"
                  name="cantidad"
                  min="0"
                  placeholder="Ingrese la cantidad mínima"
                />
              </div>

              <hr class="form-divider"/>

              <!-- Notificaciones -->
              <div class="check-section">
                <label>Seleccione dónde recibir la notificación</label>
                <div class="check-options">
                  <label class="check-opt">
                    <input type="checkbox" id="chkEmail" name="notif" value="email"/>
                    <span>Correo Electrónico</span>
                  </label>
                  <label class="check-opt">
                    <input type="checkbox" id="chkSms" name="notif" value="sms"/>
                    <span>Mensaje de Texto</span>
                  </label>
                </div>
              </div>

              <!-- Botones -->
              <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="resetForm()">Limpiar</button>
                <button type="submit" class="btn btn-primary">Registrar</button>
              </div>

            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast de confirmación -->
  <div class="toast" id="toast"></div>

<script>
const form  = document.getElementById('regForm');
const toast = document.getElementById('toast');

form.addEventListener('submit', function(e) {
  e.preventDefault();

  const producto = document.getElementById('producto').value;
  const unidad   = document.getElementById('unidad').value;
  const cantidad = document.getElementById('cantidad').value;

  if (!producto) { alert('Por favor seleccione un producto.'); return; }
  if (!unidad)   { alert('Por favor seleccione la unidad de medida.'); return; }
  if (cantidad === '' || Number(cantidad) < 0) {
    alert('Ingrese una cantidad mínima válida (número mayor o igual a 0).');
    return;
  }

  showToast('✔ Materia prima registrada correctamente.');
  form.reset();
});

function resetForm() { form.reset(); }

function showToast(mensaje) {
  toast.textContent = mensaje || '✔ Operación exitosa.';
  toast.style.display = 'block';
  setTimeout(function() { toast.style.display = 'none'; }, 3500);
}
</script>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
