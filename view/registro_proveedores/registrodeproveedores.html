<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colsoftco – Registro de Proveedores</title>
  <link href="registrop.css" rel="stylesheet">
</head>

<body>


<header>
  <a class="logo-area" href="../panel_admin/panel_admin.html">
    <div class="logo">
      <img src="../imagenes/logo.png">
    </div>
  </a>

  <div class="header-title">
    <h1>Registro de Proveedores</h1>
    <div class="title-underline"></div>
  </div>
</header>





<div class="layout">

  
  <main style="margin: 0 auto; max-width: 1000px; width: 100%;">

    
    
    
    <div class="form-card">
      <div class="form-card-header">
        <span class="form-card-bar"></span>
        Nuevos Proveedores
      </div>

      <div class="form-body">

        
        <div class="form-grid-2">
          <div class="field-group">
            <label for="razon-social">Razón Social</label>
            <input type="text" id="razon-social" placeholder="Ingrese la razón social" />
          </div>
          <div class="field-group">
            <label for="nit">NIT</label>
            <input type="text" id="nit"  />
          </div>
        </div>

        
        <div class="field-group">
          <label for="producto">Producto que suministra</label>
          <select id="producto">
            <option value="">-- Seleccione --</option>
            <option>Tela</option>
            <option>Espuma</option>
            <option>Madera</option>
            <option>Tornillos</option>
            <option>Pintura</option>
            <option>Resortes</option>
            <option>Hilo</option>
          </select>
        </div>

        
        <div class="form-grid-2">
          <div class="field-group">
            <label for="metodo-pago">Método de Pago</label>
            <select id="metodo-pago">
              <option value="">-- Seleccione --</option>
              <option>Transferencia bancaria</option>
              <option>Efectivo</option>
              <option>Cheque</option>
              <option>Crédito 30 días</option>
              <option>Crédito 60 días</option>
            </select>
          </div>
          <div class="field-group">
            <label for="telefono">Teléfono de Contacto</label>
            <input type="tel" id="telefono" placeholder="Ej: 3001234567" />
          </div>
        </div>

        
        <div class="field-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" placeholder="Ej: proveedor@empresa.com" />
        </div>

        
        <div class="field-group">
          <label class="label-static">Seleccione dónde recibir la notificación</label>
          <div class="checkbox-row">
            <label class="check-label">
              <input type="checkbox" id="notif-email" />
              <span class="check-box"></span>
              CORREO ELECTRÓNICO
            </label>
            <label class="check-label">
              <input type="checkbox" id="notif-sms" />
              <span class="check-box"></span>
              MENSAJE DE TEXTO
            </label>
          </div>
        </div>

        
        <div class="form-actions">
          <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
          <button class="btn-registrar" id="btn-registrar">Registrar</button>
        </div>

      </div>
    </div>

  </main>
</div>


<div class="toast" id="toast">
  <span id="toast-msg"></span>
</div>

<script>
  
const campos = {
  'razon-social': 'Razón Social',
  'nit':          'NIT',
  'producto':     'Producto que suministra',
  'metodo-pago':  'Método de Pago',
  'telefono':     'Teléfono de contacto',
  'correo':       'Correo electrónico'
};


function showToast(msg, tipo = 'ok') {
  const t = document.getElementById('toast');
  const m = document.getElementById('toast-msg');
  m.textContent = msg;
  t.style.borderLeftColor = tipo === 'ok' ? 'var(--gold)' : '#e74c3c';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}


function marcarError(id, mensaje) {
  const el = document.getElementById(id);
  el.style.borderColor = '#e74c3c';
  el.style.boxShadow   = '0 0 0 3px rgba(231,76,60,.15)';

  let err = el.parentElement.querySelector('.field-error');
  if (!err) {
    err = document.createElement('span');
    err.className = 'field-error';
    el.parentElement.appendChild(err);
  }
  err.textContent = mensaje;
}


function limpiarError(id) {
  const el = document.getElementById(id);
  el.style.borderColor = '';
  el.style.boxShadow   = '';
  const err = el.parentElement.querySelector('.field-error');
  if (err) err.remove();
}

function limpiarTodosErrores() {
  Object.keys(campos).forEach(limpiarError);
}


const validarNIT      = v => /^\d{6,12}(-\d)?$/.test(v.trim());
const validarEmail    = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
const validarTelefono = v => /^[0-9+\s\-]{7,15}$/.test(v.trim());


function validarFormulario() {
  let valido = true;
  limpiarTodosErrores();

  
  const rs = document.getElementById('razon-social').value.trim();
  if (!rs) {
    marcarError('razon-social', 'La razón social es obligatoria');
    valido = false;
  } else if (rs.length < 3) {
    marcarError('razon-social', 'Mínimo 3 caracteres');
    valido = false;
  }

  
  const nit = document.getElementById('nit').value.trim();
  if (!nit) {
    marcarError('nit', 'El NIT es obligatorio');
    valido = false;
  } else if (!validarNIT(nit)) {
    marcarError('nit', 'Formato inválido (ej: 9001234567 o 900123456-1)');
    valido = false;
  }

  
  if (!document.getElementById('producto').value) {
    marcarError('producto', 'Seleccione un producto');
    valido = false;
  }

 
  if (!document.getElementById('metodo-pago').value) {
    marcarError('metodo-pago', 'Seleccione un método de pago');
    valido = false;
  }

  
  const tel = document.getElementById('telefono').value.trim();
  if (!tel) {
    marcarError('telefono', 'El teléfono es obligatorio');
    valido = false;
  } else if (!validarTelefono(tel)) {
    marcarError('telefono', 'Ingrese un teléfono válido');
    valido = false;
  }

  
  const correo = document.getElementById('correo').value.trim();
  if (!correo) {
    marcarError('correo', 'El correo es obligatorio');
    valido = false;
  } else if (!validarEmail(correo)) {
    marcarError('correo', 'Ingrese un correo válido (ej: nombre@empresa.com)');
    valido = false;
  }

  
  const emailCheck = document.getElementById('notif-email').checked;
  const smsCheck   = document.getElementById('notif-sms').checked;
  if (!emailCheck && !smsCheck) {
    showToast('⚠️ Seleccione al menos un método de notificación', 'error');
    valido = false;
  }

  return valido;
}


function resetForm() {
  Object.keys(campos).forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'SELECT' ? el.selectedIndex = 0 : el.value = '';
  });
  document.getElementById('notif-email').checked = false;
  document.getElementById('notif-sms').checked   = false;
  limpiarTodosErrores();
}


document.getElementById('btn-limpiar').addEventListener('click', () => {
  resetForm();
  showToast('🧹 Formulario limpiado correctamente');
});


document.getElementById('btn-registrar').addEventListener('click', () => {
  if (!validarFormulario()) return;

  const proveedor = {
    razonSocial:   document.getElementById('razon-social').value.trim(),
    nit:           document.getElementById('nit').value.trim(),
    producto:      document.getElementById('producto').value,
    metodoPago:    document.getElementById('metodo-pago').value,
    telefono:      document.getElementById('telefono').value.trim(),
    correo:        document.getElementById('correo').value.trim(),
    notifEmail:    document.getElementById('notif-email').checked,
    notifSMS:      document.getElementById('notif-sms').checked,
    fechaRegistro: new Date().toLocaleDateString('es-CO')
  };

  console.log('✅ Proveedor registrado:', proveedor);

 
  const btn = document.getElementById('btn-registrar');
  btn.textContent          = '✓ Registrado';
  btn.style.background     = '#27ae60';
  btn.style.borderColor    = '#27ae60';
  btn.disabled             = true;

  showToast(`✅ Proveedor "${proveedor.razonSocial}" registrado exitosamente`);

  setTimeout(() => {
    btn.textContent       = 'Registrar';
    btn.style.background  = '';
    btn.style.borderColor = '';
    btn.disabled          = false;
    resetForm();
  }, 2500);
});

Object.keys(campos).forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input',  () => limpiarError(id));
  el.addEventListener('change', () => limpiarError(id));
});


document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>

<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/05/14/19/20260514194818-J71XBHCL.js" defer></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
