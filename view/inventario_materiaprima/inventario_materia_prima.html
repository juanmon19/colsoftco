<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colsoftco - Inventario Materia Prima</title>
    <link href="inventariomp.css" rel="stylesheet">
</head>

<body>

    <div class="header">
        <div class="logo">
            <a href="../panel_admin/panel_admin.html">
                <img src="../../public/imagenes/logo.png" alt="logo">
            </a>
        </div>
       <h1 class="header-title">Max & Flex</h1>

        <button id="btnLogout" class="btn-logout" onclick="cerrarSesion()">
            Cerrar sesión
        </button>
    </div>


    <div class="tab-nav">
        <button class="tab-btn active">MATERIA PRIMA</button>
    </div>

    <div class="main-content">
        <div class="table-wrapper">
            <div class="toolbar">
                <button class="btn-add" onclick="openAddModal()">+ Agregar Producto</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal-form">
        <div class="modal">
            <h3 id="modal-title">Agregar Producto</h3>
            <label>Producto</label>
            <input type="text" id="input-producto" placeholder="Nombre del producto">
            <label>Cantidad</label>
            <input type="text" id="input-cantidad" placeholder="Ej: 205 Unidades">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" onclick="guardarProducto()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-confirm">
        <div class="modal">
            <h3>Confirmar eliminación</h3>
            <p class="confirm-msg" id="confirm-msg">¿Estás seguro de eliminar este producto?</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-delete-confirm" onclick="confirmarEliminacion()">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>

        // ===== DATA =====
        // Base de datos en memoria (Simulación en un arreglo de objetos JSON)
        let productos = [
            { id: 1, nombre: "Resortes Pocket", cantidad: "x205 Unidades" },
            { id: 2, nombre: "Resortes LFK", cantidad: "x300 Unidades" },
            { id: 3, nombre: "Resortes Bonell", cantidad: "x150 Unidades" },
            { id: 4, nombre: "Microresortes", cantidad: "x200 Unidades" },
            { id: 5, nombre: "Resortes Continuous Coil", cantidad: "x245" },
            { id: 6, nombre: "Hilos", cantidad: "x15 Metros" },
            { id: 7, nombre: "Tela", cantidad: "x20 Rollos" },
            { id: 8, nombre: "Espuma", cantidad: "59 Kg" },
        ];

        // Controladores globales de estado para el ciclo CRUD
        let nextId = 9;       // Auto-incremental para el ID de los productos nuevos
        let editingId = null;  // Almacena el ID del elemento bajo edición (null = modo inserción)
        let deletingId = null; // Almacena el ID del elemento seleccionado para dar de baja

        // ===== RENDER =====
        // Dibuja dinámicamente el contenido del listado en el DOM
        function renderTabla() {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = ''; // Vacía la tabla para prevenir duplicaciones durante la recarga

            // Recorre secuencialmente cada producto del array
            productos.forEach((p, i) => {
                const tr = document.createElement('tr');
                // Estructura de interpolación HTML para las celdas
                tr.innerHTML = `
                    <td>${i + 1}. ${p.nombre}</td>
                    <td>${p.cantidad}</td>
                    <td>
                        <div class="action-cell">
                            <button class="btn-actualizar" onclick="openEditModal(${p.id})">Actualizar</button>
                            <button class="btn-eliminar"   onclick="openDeleteModal(${p.id})">Eliminar</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr); // Añade el nodo tr estructurado al contenedor tbody
            });
        }

        // ===== MODALS =====
        // Inicializa el formulario flotante para registrar un producto nuevo
        function openAddModal() {
            editingId = null; // Cambia el estado global a inserción pura
            document.getElementById('modal-title').textContent = 'Agregar Producto';
            document.getElementById('input-producto').value = '';
            document.getElementById('input-cantidad').value = '';
            document.getElementById('modal-form').classList.add('active'); // Muestra el modal vía CSS (.active)
        }

        // Prepara y despliega el formulario flotante cargando la información previa para edición
        function openEditModal(id) {
            const p = productos.find(x => x.id === id); // Busca la coincidencia exacta por ID en el array
            if (!p) return; // Rompe si no localiza el elemento
            editingId = id; // Asigna el identificador para la reescritura posterior
            document.getElementById('modal-title').textContent = 'Actualizar Producto';
            document.getElementById('input-producto').value = p.nombre;
            document.getElementById('input-cantidad').value = p.cantidad;
            document.getElementById('modal-form').classList.add('active'); // Despliega la ventana modal
        }

        // Despliega la confirmación previa al borrado permanente
        function openDeleteModal(id) {
            const p = productos.find(x => x.id === id);
            if (!p) return;
            deletingId = id; // Memoriza temporalmente el ID de eliminación
            document.getElementById('confirm-msg').textContent =
                `¿Estás seguro de eliminar "${p.nombre}"?`;
            document.getElementById('modal-confirm').classList.add('active'); // Despliega ventana de confirmación
        }

        // Oculta todas las ventanas modales de la interfaz removiendo la clase activa
        function closeModal() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        // ===== ACCIONES =====
        // Procesa la recopilación de datos para guardar (tanto para inserción como para actualización)
        function guardarProducto() {
            const nombre = document.getElementById('input-producto').value.trim();
            const cantidad = document.getElementById('input-cantidad').value.trim();

            // Validación básica de campos vacíos
            if (!nombre || !cantidad) { showToast('Complete todos los campos.'); return; }

            if (editingId === null) {
                // Flujo alterno: Crear producto nuevo
                productos.push({ id: nextId++, nombre, cantidad });
                showToast('Producto agregado.');
            } else {
                // Flujo alterno: Actualizar producto existente
                const p = productos.find(x => x.id === editingId);
                if (p) { p.nombre = nombre; p.cantidad = cantidad; }
                showToast('Producto actualizado.');
            }
            closeModal();   // Cierra la interfaz del formulario
            renderTabla();  // Redibuja la tabla con el arreglo modificado
        }

        // Efectúa la eliminación del producto mediante filtrado del array
        function confirmarEliminacion() {
            // Reasigna el array excluyendo el ID que coincide con deletingId
            productos = productos.filter(x => x.id !== deletingId);
            closeModal();   // Cierra ventana de confirmación
            renderTabla();  // Recarga el listado visual
            showToast('Producto eliminado.');
        }

        // ===== TOAST =====
        // Muestra avisos efímeros dinámicos
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show'); // Activa la visibilidad y animaciones CSS
            // Oculta el componente tras 2.5 segundos de exposición (2500 ms)
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Habilita el cierre automático si el usuario da clic fuera del contenedor blanco del modal
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
        });

    </script>
    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/05/14/19/20260514194818-J71XBHCL.js" defer></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

```
