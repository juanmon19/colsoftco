<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operario - Max & Flex</title>
    <link href="paneloperario.css" rel="stylesheet">
</head>


<body>

    <div class="header">
        BIENVENIDO
        <div class="logo">
            <img src="../imagenes/logo.png">
        </div>
        <button id="btnLogout" class="btn-logout" onclick="cerrarSesion()">
            Cerrar sesión
        </button>
    </div>

    <div class="contenedor">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <button onclick="mostrar('Lista de verificacion')">Lista de Verificaciòn</button>
            <button onclick="mostrar('Lista de Proveedores')">Lista de Proveedores</button>
            <button onclick="mostrar('Registrar Materia Prima')">Registrar Materia Prima</button>
            <button onclick="mostrar('Informe')">Generar Informe</button>
            <button onclick="mostrar('Inventario Materia Prima')">Inventario de Materia Prima</button>
            <button onclick="mostrar('Inventario Productos')">Inventario de Productos</button>

        </div>

        <!-- CONTENIDO -->
        <div class="contenido">

            <div class="bienvenida">
                <!-- Imagen usuario -->
                <img src="../imagenes/operario.jpg" alt="Usuario">

                <div class="info-usuario">
                    <h2><strong>Usuario:</strong>Jafet David Pineda Céspedes</h2>
                    <p><strong>Rol:</strong>Operario</p>
                </div>
            </div>

            <div class="tareas">
                <h3>Tareas Pendientes</h3>
                <ul>
                    <li>Controlar inventario.</li>
                    <li>Recibir mercancía.</li>
                    <li>Despachar pedidos.</li>
                    <li>Organizar la bodega.</li>
                    <li>Reportar novedades</li>
                </ul>
            </div>

        </div>
    </div>

    
<script src="../../public/js/auth.js"></script>
<script src="../../public/js/app.js"></script>
</body>

</html>
