<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
    /* ===== RESET IMPORTANTE ===== */
*{
    box-sizing: border-box;
}

/* ===== GENERAL ===== */
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    font-size: 14px;
}

.header {
    background-color: #0A1F44;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 29px;
    font-weight: bold;
    position: relative;
}

.logo {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
}

.logo img{
    width: 75px;
    cursor: pointer;
    margin-top: 10px;
}

/* ===== CONTENEDOR LOGIN ===== */
.login-container {
    background: #0A1F44;
    padding: 50px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    width: 400px;

    margin: 120px auto;
}

/* ===== TÍTULO ===== */
.login-container h2 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
    font-size: 20px;
}

/* ===== INPUTS ===== */
.input-group {
    margin-bottom: 15px;
}

.input-group label {
    color: white;
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
}

.input-group input {
    width: 100%;              /* Ahora igual que el botón */
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

/* ===== BOTÓN ===== */
.btn {
    width: 100%;              /* Igual ancho */
    padding: 10px;
    background: #D4AF37;
    border: none;
    color: black;
    font-size: 14px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;         /* Separación del input */
}

.btn:hover {
    background: white;
}

/* ===== ERROR ===== */
.error {
    color: red;
    font-size: 14px;
    text-align: center;
    margin-top: 10px;
}
</style>

<body>
    <div class="header">

        <div class="logo">
            <img src="../imagenes/logo.png">
        </div>
        INGRESE AL SISTEMA
    </div>

    <div class="login-container">
        <h2>INICIAR SESIÓN</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn">Ingresar</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="../cambiocontraseña/cambio_contrasena.html" style="color: white; text-decoration: none; font-size: 13px;">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="error" id="errorMsg"></div>
        </form>
    </div>


<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
    
/* Script para validar el login usando auth.js */
document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");

        const user = Auth.login(username, password);

        if (user) {
            window.showToast ? window.showToast("Login exitoso ✅", "success") : alert("Login exitoso ✅");
            window.location.href = "../" + ROLES[user.role].dashboard; 
        } else {
            errorMsg.textContent = "Usuario o contraseña incorrectos";
        }
    });
</script>
</body>

</html>
