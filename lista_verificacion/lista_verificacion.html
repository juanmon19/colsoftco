<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colsoftco - Lista de Verificación</title>
  <style>
    /* ===== RESET IMPORTANTE ===== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* ===== GENERAL ===== */
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        font-size: 14px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ===== HEADER ===== */
    header {
        background: #0A1F44;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 28px;
        height: 70px;
        position: sticky;
        top: 0;
        z-index: 100;
        color: white;
    }

    .logo {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
    }

    .logo img {
        width: 75px;
        cursor: pointer;
        display: block;
    }

    .header-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
    }

    /* ===== MAIN CONTENT ===== */
    .content {
        flex: 1;
        padding: 40px 20px;
        margin: 0 auto;
        max-width: 1000px;
        width: 100%;
    }

    .card {
        background: #fff;
        border-radius: 8px;
        padding: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    .card h2 {
        color: #0A1F44;
        margin-bottom: 20px;
    }
    
    .card p {
        color: #555;
        font-size: 16px;
        line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO MINIMALISTA (El botón volver se inyecta por JS) -->
  <header>
    <a class="logo">
      <img src="../imagenes/logo.png" alt="logo">
    </a>
    <div class="header-title">Lista de Verificación</div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="card">
        <h2>Lista de Verificación de Inventario y Procesos</h2>
        <p>Aquí se visualizarán los ítems a verificar (Módulo en construcción).</p>
        <!-- Aquí irá el contenido específico de la lista sin sidebars ni perfiles expuestos -->
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
