<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max&Flex - Inicio</title>
    <link href="index.css" rel="stylesheet">
    
</head>

<body>

    <!-- HEADER con logo adentro -->
    <header>
        <!-- Logo dentro del header -->
        <div class="header">

        <div class="logo">
            <img src="../view/imagenes/logo.png">
        </div>
    </div>

        <!-- Título centrado -->
        <span class="header-title">Bienvenido</span>

        <!-- Botones Login / Registrarse -->
        <div class="header-actions">
            <a href="../view/login/login.html" class="btn-header">Login</a>
            <a href="../view/registro/registro.html" class="btn-header">Registrarse</a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- Banner / imagen -->
        <div class="banner">
            <!--
            Si tienes un banner, reemplaza el div de abajo con:
            <img src="assets/img/banner.jpg" alt="Banner Max&Flex">
        -->
            <div class="banner-placeholder">
                <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="98" height="78" rx="3" stroke="#999" stroke-width="2" />
                    <line x1="1" y1="1" x2="99" y2="79" stroke="#999" stroke-width="1.5" />
                    <line x1="99" y1="1" x2="1" y2="79" stroke="#999" stroke-width="1.5" />
                </svg>
            </div>
        </div>

        <!-- Tarjeta Quiénes Somos -->
        <div class="about-card">
            <h2>Quiénes Somos</h2>
            <p>
                Somos una empresa que se dedica a la elaboración y venta de colchones, colchonetas,
                base y cabeceros de los más altos estándares de calidad.
            </p>
        </div>

    </main>

    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/05/14/18/20260514181807-VD8IZU8J.js" defer></script>

</body>

</html>
