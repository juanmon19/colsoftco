<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevos Usuario</title>
</head>

<style>
    body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f2f2f2;
    font-size: 14px;
}

.header {
    background-color: #0A1F44;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 29px;
    font-weight: bold;
    position: relative;
}

.logo {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
}

.logo img{
    width: 75px;
    cursor: pointer;
    margin-top: 10px;
}

.contenido {
    display: flex;
    justify-content: center;
}

.contenedor {
    background-color: #0A1F44;
    padding: 40px;
    width: 350px;
    border-radius: 8px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
    margin-top: 60px;
}

h2 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    color: white;
    margin-top: 10px;
    margin-bottom: 5px;
}

input,
select {
    padding: 8px;
    border-radius: 5px;
    border: none;
    background-color: white;
}

button {
    margin-top: 20px;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: #d4af37;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #b8941f;
}
</style>

<body>
    <div class="header">

        <a href="../panel_admin/panel_admin.html" class="logo">
            <img src="../imagenes/logo.png" alt="logo">
        </a>
        BIENVENIDO
    </div>

    <div class="contenido">
        <div class="contenedor">
            <h2>NUEVOS USUARIOS</h2>

            <form id="formRegistro">

                <label>Email o Teléfono</label>
                <input type="text" id="contacto" required>

                <label>Usuario</label>
                <input type="text" id="usuario" required>

                <label>Rol</label>
                <select id="rol">
                    <option>Administrador</option>
                    <option>Bodeguero</option>
                    <option>Operario</option>
                </select>

                <label>Contraseña</label>
                <input type="password" id="password" required>

                <label>Confirmar Contraseña</label>
                <input type="password" id="confirmar" required>

                <button type="submit">Registrar</button>

            </form>
        </div>
    </div>
<script>
document.getElementById("formRegistro").addEventListener("submit", function(e){
    e.preventDefault();

    let password = document.getElementById("password").value;
    let confirmar = document.getElementById("confirmar").value;

    if(password !== confirmar){
        window.showToast ? window.showToast("Las contraseñas no coinciden", "error") : alert("Las contraseñas no coinciden");
    }else{
        window.showToast ? window.showToast("Usuario registrado correctamente", "success") : alert("Usuario registrado correctamente");
        setTimeout(() => {
            document.getElementById("formRegistro").reset();
        }, 1500);
    }
});
</script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>

</html>
